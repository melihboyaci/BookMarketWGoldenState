name: Go Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Projenin kullandığı Go sürümüne göre uyarlanabilir
        cache: true

    - name: Install Dependencies
      run: go mod download

    - name: Run Tests
      # Testcontainers kullanıldığı için runner'daki varsayılan Docker servisi otomatik olarak kullanılacaktır.
      run: go test -v ./...
